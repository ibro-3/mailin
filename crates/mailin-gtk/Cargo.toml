[package]
name = "mailin-gtk"
description = "GTK 4 front-end of the Mailin desktop mail client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mailin"
path = "src/main.rs"

[dependencies]
mailin-core.workspace = true
anyhow.workspace = true
base64.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_10", "v4_12"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
gdk = { package = "gdk4", version = "0.11" }
gdk-pixbuf = { version = "0.22" }
libadwaita = { version = "0.9", features = ["v1_5"] }
webkit6 = "0.6"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
secrecy.workspace = true

[lints]
workspace = true
