[package]
name = "mailin-core"
description = "Core of the Mailin desktop mail client: accounts, local store and sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64.workspace = true
directories.workspace = true
either = "1.9"
futures-util = "0.3"
keyring = { workspace = true, optional = true }
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
  "ring",
  "rustls-platform-verifier",
] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
secrecy.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml.workspace = true
tracing.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid.workspace = true
regex = "1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
