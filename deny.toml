# cargo-deny configuration for Mailin
# Run with: cargo deny check
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisory database URL (RustSec advisory DB).
db-urls = ["https://github.com/rustsec/advisory-db"]

# Only fail for unmaintained crates that are part of THIS workspace. The
# zbus 5.x tree (via keyring -> secret-service) is unmaintained upstream with
# no migration until keyring adopts zbus 6; nothing actionable for us.
unmaintained = "workspace"

# Two advisories in sequoia-openpgp's pure-Rust crypto backend remain after the
# 2.x upgrade. Both are in RustCrypto crates that have NO patched release, so a
# fix is not available to us yet:
#   * RUSTSEC-2023-0071 (rsa "Marvin" timing): rsa 0.9.10 is latest stable and
#     rsa 0.10.0-rc is *still* affected; upstream marks it unpatched.
#   * RUSTSEC-2026-0387 (crypto-bigint timing), via rsa/elliptic-curve.
# Exposure is limited: decryption uses the user's own keyring key on their own
# device, not a network-threat model with attacker-chosen ciphertexts. Revisit
# when RustCrypto ships a fix or we can drop crypto-rust for crypto-nettle/
# crypto-openssl.
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa has no patched release (even 0.10.0-rc); local-keyring decryption only" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint no patched release for this line; via rsa/elliptic-curve" },
]

[licenses]
# Allowlist of acceptable licenses (everything not listed here is rejected).
# Everything below is permissive or public-domain-style (OSI/OASIS approved or
# equivalent). Copyleft licenses are intentionally NOT allowed except the one
# scoped exception documented below.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
]
exceptions = [
  # LGPL-2.0-or-later: sequoia-openpgp itself and buffered-reader (its
  # dependency). Sequoia requires it; this is the only copyleft exception and
  # it is scoped to these two crates. Revisit if the app's distribution model
  # changes (e.g. closed-source).
  { allow = ["LGPL-2.0-or-later"], crate = "sequoia-openpgp" },
  { allow = ["LGPL-2.0-or-later"], crate = "buffered-reader" },
]

[bans]
# Warn about duplicate dependencies (multiple versions of the same crate).
multiple-versions = "warn"

[sources]
# Only allow crates.io; fail on unknown registries.
unknown-registry = "deny"
# Git sources are allowed (matches the previous deny-git = false).
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
