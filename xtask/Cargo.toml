[package]
name = "xtask"
description = "Repository automation for Mailin"
version.workspace = true
default-run = "xtask"
edition.workspace = true
# windows-bindgen 0.100, used by `winui-bindgen`, requires Rust 1.95.
rust-version = "1.95"
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "patch-bindings"
path = "src/patch_bindings.rs"

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22", features = ["std"] }
windows-bindgen = "0.100"
windows-metadata = "0.100"

[lints]
workspace = true
