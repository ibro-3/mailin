name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  linux:
    name: Linux build, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install GTK stack (needed from milestone 3 on)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev \
            appstream desktop-file-utils

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Packaging metadata
        run: |
          appstreamcli validate --no-net packaging/flatpak/dev.mailin.Mailin.metainfo.xml
          desktop-file-validate packaging/flatpak/dev.mailin.Mailin.desktop

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mailin.flatpak
          manifest-path: packaging/flatpak/dev.mailin.Mailin.json
          cache-key: "flatpak-${{ hashFiles('Cargo.lock', 'packaging/flatpak/dev.mailin.Mailin.json') }}"
          artifact-name: mailin-x86_64.flatpak

  integration:
    name: IMAP/SMTP integration (plaintext)
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:latest
        ports:
          - 3143:3143
          - 3025:3025
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=ada:correct-horse@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for IMAP
        run: |
          for i in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "IMAP is up"; break
            fi
            sleep 2
          done
      - name: Integration tests (plaintext)
        env:
          MAILIN_IT_IMAP_ADDR: 127.0.0.1:3143
          MAILIN_IT_SMTP_ADDR: 127.0.0.1:3025
        run: cargo test -p mailin-core --test imap_it -- --ignored --nocapture

  integration-tls:
    name: IMAP/SMTP integration (implicit TLS)
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:latest
        ports:
          - 3993:3993   # IMAPS
          - 3465:3465   # SMTPS
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=ada:correct-horse@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for IMAPS
        run: |
          for i in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/3993) 2>/dev/null; then
              echo "IMAPS is up"; break
            fi
            sleep 2
          done
      - name: Integration tests (implicit TLS)
        env:
          MAILIN_IT_IMAPS_ADDR: 127.0.0.1:3993
          MAILIN_IT_SMTPS_ADDR: 127.0.0.1:3465
        run: cargo test -p mailin-core --test imap_it_tls -- --ignored --nocapture

  integration-starttls:
    name: IMAP/SMTP integration (STARTTLS)
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:latest
        ports:
          - 3143:3143   # IMAP with STARTTLS
          - 3025:3025   # SMTP with STARTTLS
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=ada:correct-horse@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Wait for IMAP (STARTTLS)
        run: |
          for i in $(seq 1 40); do
            if (exec 3<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "IMAP (STARTTLS) is up"; break
            fi
            sleep 2
          done
      - name: Integration tests (STARTTLS)
        env:
          MAILIN_IT_IMAP_STARTTLS_ADDR: 127.0.0.1:3143
          MAILIN_IT_SMTP_STARTTLS_ADDR: 127.0.0.1:3025
        run: cargo test -p mailin-core --test imap_it_starttls -- --ignored --nocapture

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    env:
      MAILIN_WINDOWSAPPSDK_BOOTSTRAP: ${{ github.workspace }}\target\winui-runtime\Microsoft.WindowsAppRuntime.Bootstrap.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (core)
        run: cargo clippy -p mailin-core --all-targets -- -D warnings

      - name: Tests (core)
        run: cargo test -p mailin-core

      - name: Fetch Windows App SDK bootstrapper
        run: cargo run -p xtask -- winui-runtime

      - name: Install Windows App SDK 1.8 runtime
        run: |
          $installer = "$env:RUNNER_TEMP\WindowsAppRuntimeInstall-x64.exe"
          curl.exe -L --fail --silent --show-error -o $installer `
            https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe
          $process = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList "--quiet"
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Clippy (WinUI)
        run: >-
          cargo clippy -p mailin-winui -p mailin-winui-sys --all-targets
          --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests (WinUI)
        run: cargo test -p mailin-winui --target x86_64-pc-windows-msvc

      - name: Build (WinUI)
        run: cargo build --release -p mailin-winui --target x86_64-pc-windows-msvc

      - name: Upload WinUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailin-winui-x86_64
          path: |
            target/x86_64-pc-windows-msvc/release/mailin-winui.exe
            target/x86_64-pc-windows-msvc/release/Microsoft.WindowsAppRuntime.Bootstrap.dll
          if-no-files-found: error
